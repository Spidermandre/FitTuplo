name: CI e deploy su GitHub Pages

on:
  push:
    branches: [claude/brave-galileo-8x8fgk]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Controlli di qualità: restano verdi anche se Pages non è ancora attivo.
  build:
    name: Lint, test e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Richiede Pages attivo una volta sola:
  # Settings → Pages → Source: "GitHub Actions".
  deploy:
    name: Deploy su Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
